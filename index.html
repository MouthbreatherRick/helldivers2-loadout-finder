<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Helldivers 2 – Loadout Finder + Squad Challenge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Role-driven, community-informed Helldivers 2 loadouts and squad challenges.">
  <link rel="preconnect" href="https://hits.sh">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <h1>Helldivers 2 – Loadout Finder + Squad Challenge</h1>
    <div class="visitor-pill" id="visitor-pill" title="Unique visits">
      <span>Lifetime Site Visitors:</span>
      <strong id="visitor-count">—</strong>
    </div>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="Modes">
      <button class="tab active" data-tab="finder" role="tab" aria-selected="true">Loadout Finder</button>
      <button class="tab" data-tab="challenge" role="tab" aria-selected="false">Squad Challenge</button>
    </nav>

    <!-- Global controls -->
    <section class="controls" id="controls">
      <div class="control">
        <label for="faction">Faction</label>
        <select id="faction">
          <option>Terminids (Bugs)</option>
          <option>Automatons (Bots)</option>
          <option>Illuminate (Squids)</option>
        </select>
      </div>
      <div class="control">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option>Trivial</option>
          <option>Easy</option>
          <option>Medium</option>
          <option>Challenging</option>
          <option>Hard</option>
          <option>Extreme</option>
          <option>Suicide Mission</option>
          <option>Impossible</option>
          <option>Helldive</option>
          <option>Super Helldive</option>
        </select>
      </div>
      <div class="control">
        <label for="objective">Objective</label>
        <select id="objective"></select>
      </div>
      <div class="control">
        <label for="team-synergy">Synergy Focus</label>
        <select id="team-synergy">
          <option value="balanced" selected>Balanced Squad</option>
          <option value="anti-armor">Anti-Armor Pressure</option>
          <option value="control">Crowd Control</option>
          <option value="sustain">Sustain/Medic</option>
          <option value="recon">Recon/Scout</option>
        </select>
      </div>
      <button class="btn btn-primary" id="reroll" title="Rebuild with new seeds">Rebuild</button>
    </section>

    <!-- Loadout Finder -->
    <section id="finder" class="panel active" role="tabpanel" aria-label="Loadout Finder">
      <div class="panel-actions">
        <div class="hint">Click a card to select it.</div>
        <button class="btn" id="copy-finder" disabled>Copy selected</button>
      </div>
      <div class="squad-grid" id="finder-squad">
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
      </div>

      <!-- Banner AFTER loadout cards and BEFORE footer -->
      <div class="banner-wrap">
        <a href="https://www.youtube.com/@mouthbreathertv" target="_blank" rel="noopener"
          aria-label="Visit MouthbreatherTV on YouTube">
          <img src="HellaThickDivers.jpg" alt="HellaThickDivers Banner" class="hella-banner" loading="lazy">
        </a>
      </div>
    </section>

    <!-- Squad Challenge -->
    <section id="challenge" class="panel" role="tabpanel" aria-label="Squad Challenge">
      <div class="challenge-controls">
        <button class="btn" id="randomize-challenge">Randomize Squad</button>
        <label class="inline">
          <input type="checkbox" id="enforce-boosters" checked>
          Enforce ≤ 2 duplicate boosters
        </label>
        <label class="inline">
          <input type="checkbox" id="faction-grenades" checked>
          Use faction grenade logic
        </label>
      </div>
      <div class="panel-actions">
        <div class="hint">Click a card to select it.</div>
        <button class="btn" id="copy-challenge" disabled>Copy selected</button>
      </div>
      <div class="squad-grid" id="challenge-squad">
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made by Garrick Woods &amp; friends — for Democracy! · <a href="https://helldivers.fandom.com/wiki/Helldivers_2"
        target="_blank" rel="noopener">Wiki</a></p>
  </footer>

  <script src="script.js" defer></script>
</body>

</html>
